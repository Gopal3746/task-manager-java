spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasktracker}
    username: ${DB_USERNAME:taskuser}
    password: ${DB_PASSWORD:taskpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-1234567890}
    expiration-minutes: 120

server:
  error:
    include-message: always
